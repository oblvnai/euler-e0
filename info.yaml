# Tiny Tapeout project information
project:
  title:        "Euler E0 - INT8 systolic matrix engine"
  author:       "Planck Silicon (Josue Emanuel Gonzalez Nevares)"
  discord:      ""
  description:  "2x2 INT8 systolic-array matrix multiply with ReLU: one neural-network layer in hardware"
  language:     "Verilog"
  clock_hz:     50000000

  # Synthesized cell area is ~18,600 um2 (sky130_fd_sc_hd). One tile is ~167x108 um,
  # so 1x2 should fit at ~50% utilization. If the GDS action reports congestion, use "2x2".
  tiles: "1x2"

  top_module:  "tt_um_planck_e0"

  source_files:
    - "project.v"
    - "euler_core.v"
    - "euler_pe.v"

pinout:
  # Inputs
  ui[0]: "DIN[0]"
  ui[1]: "DIN[1]"
  ui[2]: "DIN[2]"
  ui[3]: "DIN[3]"
  ui[4]: "DIN[4]"
  ui[5]: "DIN[5]"
  ui[6]: "DIN[6]"
  ui[7]: "DIN[7]"

  # Outputs
  uo[0]: "DOUT[0]"
  uo[1]: "DOUT[1]"
  uo[2]: "DOUT[2]"
  uo[3]: "DOUT[3]"
  uo[4]: "DOUT[4]"
  uo[5]: "DOUT[5]"
  uo[6]: "DOUT[6]"
  uo[7]: "DOUT[7]"

  # Bidirectional pins
  uio[0]: "OP[0] (in)"
  uio[1]: "OP[1] (in)"
  uio[2]: "OP[2] (in)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: "BUSY (out)"
  uio[6]: "DONE (out)"
  uio[7]: "VALID (in)"

# Do not change!
yaml_version: 6
